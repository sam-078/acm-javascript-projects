<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller &  Random Password Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            background-color: #f4f4f9;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 450px;
        }
        input[type="number"], input[type="text"] {
            padding: 8px;
            width: 100px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .dice-images img {
            width: 50px;
            margin: 5px;
        }
        .result-box {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>~Dice Roller~</h2>
        <label for="numOfDice">Number of Dice:</label><br>
        <input type="number" id="numOfDice" value="1" min="1"><br>
        <button id="rollBtn">Roll Dice</button>
        
        <div class="result-box" id="diceResult"></div>
        <div class="dice-images" id="diceImages"></div>
    </div>


    <div class="container">
        <h2>~Random Password Generator~</h2>
        <label for="passLength">Password Length:</label><br>
        <input type="number" id="passLength" value="12" min="1"><br><br>

        <input type="checkbox" id="includeLower" checked>
        <label for="includeLower">Include Lowercase (a-z)</label><br>

        <input type="checkbox" id="includeUpper" checked>
        <label for="includeUpper">Include Uppercase (A-Z)</label><br>

        <input type="checkbox" id="includeNumbers" checked>
        <label for="includeNumbers">Include Numbers (0-9)</label><br>

        <input type="checkbox" id="includeSymbols" checked>
        <label for="includeSymbols">Include Symbols (!@#$)</label><br><br>

        <button id="passwordBtn">Generate Password</button>
        
        <div class="result-box" id="passwordResult"></div>
    </div>

    <!-- Link to your JavaScript File -->
    <script src="PROJECT2.JS"></script>
</body>
</html>
